name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build ShaadiLens.sln -c Release
      - run: dotnet test ShaadiLens.sln -c Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/shaadilens-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/shaadilens-web/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  face-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shaadilens/face-service:ci face-service
      - run: docker run --rm shaadilens/face-service:ci pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml config --quiet
