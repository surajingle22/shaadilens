# nginx inside the `web` container:
#  - serves the compiled Angular app (SPA fallback to index.html)
#  - reverse-proxies API traffic to the .NET container, so browser and API share one origin
#    (no CORS, and Cloudflare Tunnel only needs to point at this one port).

# Behind Cloudflare Tunnel the original scheme (https) arrives in X-Forwarded-Proto.
# Pass it on; fall back to our own scheme when nginx is hit directly.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Photo uploads (chunked in Phase 1, but keep a generous ceiling)
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API, health, media, Swagger, Hangfire dashboard ---
    location ~ ^/(api|health|media|swagger|openapi|hangfire)(/|$) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_request_buffering off;   # stream uploads straight to the API
    }

    # --- SignalR (WebSockets) ---
    location /hubs/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
    }

    # --- Hashed JS/CSS bundles: cache forever ---
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Angular routes (/admin/..., /g/:token) -> index.html ---
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
