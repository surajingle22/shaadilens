# nginx inside the `web` container:
#  - serves the compiled Angular app (SPA fallback to index.html)
#  - reverse-proxies API traffic to the .NET container, so browser and API share one origin
#    (no CORS, and Cloudflare Tunnel only needs to point at this one port).

# Behind Cloudflare Tunnel the original scheme (https) arrives in X-Forwarded-Proto.
# Pass it on; fall back to our own scheme when nginx is hit directly.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Client IP for the api. Behind Caddy, X-Forwarded-For already holds the real client IP (Caddy replaces any
# value a client sends). Pass it on unchanged instead of appending our own hop: ASP.NET's ForwardedHeaders
# reads only the LAST entry, which would otherwise be Caddy's container IP for every guest — and the PIN
# brute-force limiter and rate limiter would then treat the whole wedding as one IP.
# Without a proxy in front (dev), the header is empty and we send the real peer address, as before.
map $http_x_forwarded_for $client_xff {
    default $http_x_forwarded_for;
    ''      $remote_addr;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Photo uploads (chunked in Phase 1, but keep a generous ceiling)
    client_max_body_size 60m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API, health, media, Swagger, Hangfire dashboard ---
    location ~ ^/(api|health|media|swagger|openapi|hangfire)(/|$) {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $client_xff;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_request_buffering off;   # stream uploads straight to the API
    }

    # --- SignalR (WebSockets) ---
    location /hubs/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_xff;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
        access_log off;                # the guest token travels as ?access_token=… here — keep it out of logs
    }

    # --- Service worker + manifest: must always be re-checked, or phones would keep an old app forever ---
    location ~ ^/(ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # --- Hashed JS/CSS bundles: cache forever ---
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Angular routes (/admin/..., /g/:token) -> index.html ---
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
